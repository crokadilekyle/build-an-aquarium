<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpeedXL</title><link rel="stylesheet" href="styles.css"></head><body>
<div id="game"></div><header><a href="../">← Creek Games</a><b>SPEED<span>XL</span></b><small>ULTIMATE CIRCUIT</small></header>
<section id="raceHud"><div><small>POSITION</small><strong id="position">1 / 8</strong></div><div><small>LAP</small><strong id="lap">1 / 3</strong></div><div><small>TIME</small><strong id="time">00:00.000</strong></div></section>
<div id="speed"><strong id="speedValue">0</strong><span>MPH</span><i><em id="rpm"></em></i><small id="gear">N</small></div><div id="nitro"><small>NITRO</small><i><em id="nitroFill"></em></i></div><div id="message"></div>
<section id="mobile"><div class="steer"><button id="leftBtn">◀</button><button id="rightBtn">▶</button></div><div class="pedals"><button id="brakeBtn">BRAKE</button><button id="nitroBtn">NITRO</button><button id="gasBtn">GAS</button></div></section>
<div id="start"><div class="card"><div class="logo">SPEED<span>XL</span></div><p>Push a high-performance racing machine to its limit.</p><button id="playBtn">START RACE</button><ul><li>WASD / arrows to drive</li><li>Shift for nitro boost</li><li>Space for handbrake drift</li></ul></div></div>
<div id="end"><div class="card"><h1 id="endTitle"></h1><p id="endText"></p><button id="againBtn">RACE AGAIN</button></div></div>
<script type="module" src="script.js"></script></body></html>
